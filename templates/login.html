<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="" height="36" class="me-2">
      OBMG PORTAL
    </a>

    <div class="d-flex align-items-center gap-3">


    </div>
  </div>

<div class="page-center">
  <div class="card-glass">
    <h3 class="mb-2 text-center">Sign in</h3>
    <p class="text-muted text-center mb-4">
      Enter your credentials to continue
    </p>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100"  onclick="login()" >
        Login
      </button>
       <div id="loginMessage"></div>

    </form>
  </div>
</div>
<script>
  async function login() {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    message.innerHTML = "Authenticating...";

    try {

        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        console.log("HTTP Status:", response.status);
        console.log("HTTP OK:", response.ok);

        const text = await response.text();

        console.log("Server response:", text);

        let result;

        try {
            result = JSON.parse(text);
        } catch (e) {
            message.innerHTML = "Server returned invalid response.";
            return;
        }

        if (response.ok && result.success) {

            message.innerHTML = "Login successful";

            <!--window.location.href = "/home";-->
<!--            const visit_id='1001441572';-->
<!--            window.location.href = `/Demographics/${visit_id}`;-->
<!--            available_details_routes.available_details-->
            window.location.href = `/details`;

        } else {

            message.innerHTML =
                result.message || "Invalid username or password";
        }

    } catch (error) {

        console.error("FETCH ERROR:", error);

        message.innerHTML =
            "Unable to connect to the server: " + error.message;
    }
}
</script>
